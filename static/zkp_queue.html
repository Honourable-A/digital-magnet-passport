<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Queue — TRACE4MAGNET</title>
  <script src="/static/snarkjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #0f0f0f; color: #ddd; min-height: 100vh; padding: 32px; }

    .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; }
    h1 { font-size: 13px; color: #555; letter-spacing: 3px; text-transform: uppercase; }
    .topbar-right { font-size: 11px; color: #444; }
    .topbar-right span { color: #777; margin-right: 16px; }
    .topbar-right a { color: #444; cursor: pointer; text-decoration: none; }
    .topbar-right a:hover { color: #aaa; }

    .panel { background: #161616; border: 1px solid #1e1e1e; border-radius: 6px; padding: 24px; margin-bottom: 20px; }
    .panel h2 { font-size: 11px; color: #444; letter-spacing: 2px; margin-bottom: 18px; }

    .status-bar { font-size: 11px; color: #555; padding: 10px 14px; background: #111;
      border: 1px solid #1a1a1a; border-radius: 4px; margin-bottom: 18px; }
    .status-bar.ok   { color: #4caf50; border-color: #1a3a1a; }
    .status-bar.err  { color: #ef5350; border-color: #3a1a1a; }
    .status-bar.warn { color: #ffb74d; border-color: #3a2a1a; }
    .status-bar.info { color: #64b5f6; border-color: #1a2a3a; }

    .field-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
    label { font-size: 11px; color: #555; width: 140px; flex-shrink: 0; }
    input {
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #ddd;
      padding: 8px 12px; border-radius: 4px; font-size: 12px; font-family: monospace; flex: 1;
    }
    input:focus { outline: none; border-color: #444; }
    input[readonly] { color: #666; cursor: default; }

    button {
      background: #1e1e1e; border: 1px solid #2e2e2e; color: #aaa;
      padding: 9px 22px; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-family: monospace; letter-spacing: 1px;
    }
    button:hover { background: #252525; border-color: #444; color: #ddd; }
    button:disabled { opacity: 0.3; cursor: default; }
    button.action { border-color: #2a3a2a; color: #81c784; }
    button.action:hover { background: #1a2a1a; }
    button.proof { border-color: #2a2a3a; color: #9fa8da; }
    button.proof:hover { background: #1a1a2a; }

    .row { display: flex; gap: 10px; margin-top: 18px; align-items: center; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; letter-spacing: 1px; }
    .badge.MANUFACTURER { background: #1a2a3a; color: #64b5f6; }
    .badge.RECYCLER     { background: #1a3a1a; color: #81c784; }

    .result-box { margin-top: 20px; padding: 20px 24px; border-radius: 6px; }
    .result-box.pass    { background: #0d1f0d; border: 1px solid #1a4a1a; color: #4caf50; }
    .result-box.fail    { background: #1f0d0d; border: 1px solid #4a1a1a; color: #ef5350; }
    .result-box.invalid { background: #1a1a0d; border: 1px solid #4a4a1a; color: #ffb74d; }
    .result-box .headline { font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
    .result-box .detail  { font-size: 11px; color: #777; margin-top: 4px; letter-spacing: 1px; }
    .proof-badge { font-size: 10px; margin-top: 10px; padding: 6px 10px; border-radius: 3px;
      background: #111; border: 1px solid #222; color: #4caf50; display: inline-block; }
    .proof-badge.bad { color: #ef5350; }

    .session-card { border: 1px solid #1e1e1e; border-radius: 5px; padding: 18px; margin-bottom: 16px; background: #111; }
    .session-card h3 { font-size: 11px; color: #555; letter-spacing: 1px; margin-bottom: 14px; }

    .proof-anim { display: none; font-size: 11px; color: #9fa8da; margin-top: 10px; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .blink { animation: blink 1s infinite; }

    #standing-by { text-align: center; padding: 48px; color: #333; font-size: 12px; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>TRACE4MAGNET — VERIFICATION QUEUE</h1>
  <div class="topbar-right">
    <span id="info-email"></span>
    <span class="badge" id="info-role-badge"></span>
    &nbsp;&nbsp;
    <a onclick="window.location.href='peer_discovery.html'">← back to peer list</a>
  </div>
</div>

<!-- RECYCLER view -->
<div id="view-recycler" style="display:none">
  <div class="panel">
    <h2>YOUR VERIFICATION REQUEST</h2>
    <div id="rec-status" class="status-bar info">Initialising WebRTC...</div>

    <div class="field-row"><label>target peer</label><input id="rec-target" readonly></div>
    <div class="field-row"><label>passport</label><input id="rec-passport" readonly value="DMP-TEST-001"></div>
    <div class="field-row"><label>element</label><input id="rec-element" readonly></div>
    <div class="field-row"><label>condition</label><input id="rec-condition" readonly></div>
    <div class="field-row"><label>threshold (%)</label><input id="rec-threshold" readonly></div>

    <div id="rec-result" style="display:none"></div>

    <div class="row">
      <button type="button" id="btn-rec-done" style="display:none" onclick="recyclerDone()">close session</button>
    </div>
  </div>
</div>

<!-- MANUFACTURER view -->
<div id="view-manufacturer" style="display:none">
  <div class="panel">
    <h2>INCOMING VERIFICATION REQUESTS</h2>
    <div id="mfr-status" class="status-bar info">Listening for incoming connections...</div>
    <div id="standing-by">Standing by — no active requests.</div>
    <div id="session-list"></div>
  </div>
</div>

<script>
  const API     = "http://localhost:8000/api/v1";
  const WS_BASE = "ws://localhost:8000/ws/signal";
  const ICE_CFG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  const token   = sessionStorage.getItem("t4m_token");
  const myEmail = sessionStorage.getItem("t4m_email") || "";
  const myRole  = sessionStorage.getItem("t4m_role")  || "";
  const myUid   = sessionStorage.getItem("t4m_uid")   || "";

  if (!token || !myUid) { window.location.href = "peer_discovery.html"; }

  document.getElementById("info-email").textContent = myEmail;
  const roleBadge = document.getElementById("info-role-badge");
  roleBadge.textContent = myRole;
  roleBadge.className = "badge " + myRole;

  function apiHeaders() {
    return { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };
  }

  // ============================================================
  // RECYCLER FLOW
  // ============================================================
  let recyclerDc = null;

  async function initRecycler() {
    document.getElementById("view-recycler").style.display = "block";

    const target = JSON.parse(sessionStorage.getItem("t4m_target")   || "null");
    const form   = JSON.parse(sessionStorage.getItem("t4m_zkp_form") || "null");

    if (!target || !form) {
      setRecStatus("Missing session data — go back and try again.", "err");
      return;
    }

    const opLabel = { gt: "Greater than (>)", lt: "Less than (<)" };
    document.getElementById("rec-target").value    = target.name;
    document.getElementById("rec-element").value   = form.element;
    document.getElementById("rec-condition").value = opLabel[form.operator] || form.operator;
    document.getElementById("rec-threshold").value = form.threshold;

    const pc           = new RTCPeerConnection(ICE_CFG);
    const sessionRoom  = `${myUid}-${target.supabase_uid}`;

    // Data channel — recycler is the offerer so creates it
    const dc = pc.createDataChannel("zkp");
    recyclerDc = dc;

    dc.onopen = () => {
      setRecStatus("WebRTC channel open — sending ZKP request...", "ok");
      dc.send(JSON.stringify({
        type:        "zkp_request",
        element:     form.element,
        operator:    form.operator,
        threshold:   form.threshold,
        passport_id: form.passport_id
      }));
      setRecStatus("ZKP request sent — awaiting proof from manufacturer...", "warn");
    };

    dc.onmessage = async (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      if (msg.type === "zkp_result") {
        await verifyAndShowResult(msg, form);
      }
    };

    dc.onerror = () => setRecStatus("Data channel error.", "err");

    // Buffered ICE candidates — only sent after answer is received
    let pendingCandidates = [];
    let answerReceived    = false;
    let sessionWs         = null;

    pc.onicecandidate = (evt) => {
      if (!evt.candidate) return;
      if (answerReceived && sessionWs && sessionWs.readyState === WebSocket.OPEN) {
        sessionWs.send(JSON.stringify({ type: "ice_candidate", candidate: evt.candidate.toJSON() }));
      } else {
        pendingCandidates.push(evt.candidate.toJSON());
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed") {
        setRecStatus("WebRTC connection failed. Please go back and try again.", "err");
      }
    };

    // Open session room WS first (to receive answer + manufacturer ICE)
    sessionWs = new WebSocket(`${WS_BASE}/${sessionRoom}`);

    sessionWs.onmessage = async (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }

      if (msg.type === "zkp_answer") {
        await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
        answerReceived = true;
        // Flush buffered ICE candidates now that manufacturer is ready
        for (const c of pendingCandidates) {
          sessionWs.send(JSON.stringify({ type: "ice_candidate", candidate: c }));
        }
        pendingCandidates = [];
        setRecStatus("SDP exchanged — establishing direct connection...", "info");

      } else if (msg.type === "ice_candidate") {
        try { await pc.addIceCandidate(msg.candidate); } catch {}
      }
    };

    sessionWs.onopen = async () => {
      setRecStatus("Creating WebRTC offer...", "info");

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // Send offer to manufacturer via notification room
      const notifWs = new WebSocket(`${WS_BASE}/${target.supabase_uid}`);
      notifWs.onopen = () => {
        notifWs.send(JSON.stringify({
          type:              "zkp_offer",
          recycler_uid:      myUid,
          recycler_name:     myEmail,
          recycler_peer_id:  sessionStorage.getItem("t4m_peer_id") || "",
          sdp:               offer.sdp
        }));
        setTimeout(() => notifWs.close(), 400);
        setRecStatus("Offer sent — waiting for manufacturer to accept...", "warn");
      };
      notifWs.onerror = () => setRecStatus("Could not reach signaling server.", "err");
    };

    sessionWs.onerror = () => setRecStatus("Signaling channel error.", "err");
  }

  function setRecStatus(text, cls) {
    const el = document.getElementById("rec-status");
    el.textContent = text;
    el.className = "status-bar " + (cls || "");
  }

  async function verifyAndShowResult(msg, form) {
    setRecStatus("Proof received — running cryptographic verification...", "info");

    try {
      const vKey       = await fetch("/static/zkp/verification_key.json").then(r => r.json());
      const cryptoValid = await snarkjs.groth16.verify(vKey, msg.publicSignals, msg.proof);

      if (!cryptoValid) {
        setRecStatus("Proof is cryptographically INVALID — rejected.", "err");
        showRecResult({ cryptoValid: false });
        return;
      }

      // public signals: [result, threshold_scaled, is_gt]
      const expectedThreshold = String(Math.round(form.threshold * 10));
      const expectedIsGt      = form.operator === "gt" ? "1" : "0";

      if (msg.publicSignals[1] !== expectedThreshold || msg.publicSignals[2] !== expectedIsGt) {
        setRecStatus("Proof parameters do not match the original request — rejected.", "err");
        showRecResult({ cryptoValid: true, paramsMismatch: true });
        return;
      }

      const claimMet = msg.publicSignals[0] === "1";
      setRecStatus(claimMet ? "Proof verified — claim satisfied." : "Proof verified — claim not met.", claimMet ? "ok" : "warn");
      showRecResult({ cryptoValid: true, paramsMismatch: false, claimMet, element: msg.element, operator: msg.operator, threshold: msg.threshold });

    } catch (err) {
      setRecStatus("Verification error: " + err.message, "err");
    }
  }

  function showRecResult({ cryptoValid, paramsMismatch, claimMet, element, operator, threshold }) {
    const el = document.getElementById("rec-result");
    el.style.display = "block";

    if (!cryptoValid) {
      el.innerHTML = `
        <div class="result-box invalid">
          <div class="headline">PROOF INVALID</div>
          <p class="detail">The proof does not pass cryptographic verification.</p>
          <div class="proof-badge bad">ZK proof failed</div>
        </div>`;
    } else if (paramsMismatch) {
      el.innerHTML = `
        <div class="result-box invalid">
          <div class="headline">PARAMETER MISMATCH</div>
          <p class="detail">The proof was generated for different parameters than requested.</p>
          <div class="proof-badge bad">ZK proof rejected</div>
        </div>`;
    } else {
      const opLabel = operator === "gt" ? ">" : "<";
      el.innerHTML = `
        <div class="result-box ${claimMet ? "pass" : "fail"}">
          <div class="headline">${claimMet ? "✓ CLAIM VERIFIED" : "✗ CLAIM NOT MET"}</div>
          <p class="detail">${element} ${opLabel} ${threshold}% — ${claimMet ? "condition satisfied" : "condition not satisfied"}</p>
          <div class="proof-badge">ZK proof cryptographically valid &nbsp;·&nbsp; WebRTC P2P channel</div>
        </div>`;
    }

    document.getElementById("btn-rec-done").style.display = "inline-block";
  }

  async function recyclerDone() {
    const target = JSON.parse(sessionStorage.getItem("t4m_target") || "null");
    if (target) {
      await fetch(`${API}/p2p/disconnect/${target.id}`, { method: "POST", headers: apiHeaders() }).catch(() => {});
    }
    if (recyclerDc) { try { recyclerDc.close(); } catch {} }
    sessionStorage.removeItem("t4m_target");
    sessionStorage.removeItem("t4m_zkp_form");
    window.location.href = "peer_discovery.html";
  }

  // ============================================================
  // MANUFACTURER FLOW
  // ============================================================
  const activeSessions = {};

  function initManufacturer() {
    document.getElementById("view-manufacturer").style.display = "block";

    const notifWs = new WebSocket(`${WS_BASE}/${myUid}`);
    notifWs.onopen  = () => setMfrStatus("Standing by — listening for incoming WebRTC connections.", "info");
    notifWs.onerror = () => setMfrStatus("Notification channel error — check server.", "err");

    notifWs.onmessage = async (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      if (msg.type === "zkp_offer") {
        await handleOffer(msg);
      }
    };

    window._notifWs = notifWs;
  }

  function setMfrStatus(text, cls) {
    const el = document.getElementById("mfr-status");
    el.textContent = text;
    el.className = "status-bar " + (cls || "");
  }

  async function handleOffer(offerMsg) {
    const { recycler_uid, recycler_name, recycler_peer_id, sdp } = offerMsg;
    if (activeSessions[recycler_uid]) return;

    document.getElementById("standing-by").style.display = "none";
    setMfrStatus(`Incoming connection from ${recycler_name}.`, "warn");

    const cardId = "card-" + recycler_uid.replace(/[^a-z0-9]/gi, "");
    const pc     = new RTCPeerConnection(ICE_CFG);

    activeSessions[recycler_uid] = {
      pc, cardId,
      recyclerName: recycler_name, recyclerPeerId: recycler_peer_id,
      dc: null, proof: null, publicSignals: null,
      operator: null, element: null, threshold: null
    };

    // Render card immediately so the list is never empty
    renderSessionCard(recycler_uid, recycler_name, cardId);
    updateCardStatus(cardId, "Establishing WebRTC connection...", "info");

    // Two flags to coordinate: WS may open before answer is ready, or vice versa
    let pendingCandidates = [];
    let wsReady  = false;
    let answerSdp = null;
    const sessionRoom = `${recycler_uid}-${myUid}`;
    const sessionWs   = new WebSocket(`${WS_BASE}/${sessionRoom}`);

    function flushSignaling() {
      sessionWs.send(JSON.stringify({ type: "zkp_answer", sdp: answerSdp }));
      for (const c of pendingCandidates) {
        sessionWs.send(JSON.stringify({ type: "ice_candidate", candidate: c }));
      }
      pendingCandidates = [];
    }

    // Set onopen BEFORE any awaits — WS to localhost opens in <1ms
    sessionWs.onopen = () => {
      wsReady = true;
      if (answerSdp) flushSignaling();  // answer already ready, send now
    };

    sessionWs.onmessage = async (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      if (msg.type === "ice_candidate") {
        try { await pc.addIceCandidate(msg.candidate); } catch {}
      }
    };

    sessionWs.onerror = () => updateCardStatus(cardId, "Signaling channel error.", "err");

    pc.onicecandidate = (evt) => {
      if (!evt.candidate) return;
      if (wsReady) {
        sessionWs.send(JSON.stringify({ type: "ice_candidate", candidate: evt.candidate.toJSON() }));
      } else {
        pendingCandidates.push(evt.candidate.toJSON());
      }
    };

    pc.ondatachannel = (evt) => {
      const dc = evt.channel;
      activeSessions[recycler_uid].dc = dc;

      dc.onopen = () => {
        sessionWs.close();
        updateCardStatus(cardId, "WebRTC channel open — waiting for ZKP request...", "ok");
      };

      dc.onmessage = (msgEvt) => {
        let msg;
        try { msg = JSON.parse(msgEvt.data); } catch { return; }
        if (msg.type === "zkp_request") {
          activeSessions[recycler_uid].operator  = msg.operator;
          activeSessions[recycler_uid].element   = msg.element;
          activeSessions[recycler_uid].threshold = msg.threshold;
          populateSessionCard(cardId, msg);
        }
      };

      dc.onerror = () => updateCardStatus(cardId, "Data channel error.", "err");
    };

    pc.onconnectionstatechange = () => {
      const state = pc.connectionState;
      if (state === "connected") {
        updateCardStatus(cardId, "WebRTC connected — waiting for ZKP request...", "ok");
      } else if (state === "failed") {
        updateCardStatus(cardId, "WebRTC connection failed.", "err");
      }
    };

    // Awaits happen AFTER all handlers are registered
    await pc.setRemoteDescription({ type: "offer", sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    answerSdp = answer.sdp;
    if (wsReady) flushSignaling();  // WS already open, send now
  }

  function renderSessionCard(recycler_uid, recyclerName, cardId) {
    const card = document.createElement("div");
    card.className = "session-card";
    card.id = cardId;
    card.innerHTML = `
      <h3>REQUEST FROM <span style="color:#bbb">${recyclerName}</span>
        <span style="color:#1a3a1a; font-size:10px; float:right; margin-top:1px">● WebRTC P2P</span></h3>
      <div id="${cardId}-status" class="status-bar info">Establishing WebRTC connection...</div>
      <div id="${cardId}-fields" style="display:none">
        <div class="field-row"><label>passport</label><input readonly value="DMP-TEST-001"></div>
        <div class="field-row"><label>element</label><input id="${cardId}-el" readonly></div>
        <div class="field-row"><label>condition</label><input id="${cardId}-cond" readonly></div>
        <div class="field-row"><label>threshold (%)</label><input id="${cardId}-thresh" readonly></div>
        <div class="field-row" style="margin-top:18px">
          <label>actual value (%)</label>
          <input type="number" id="${cardId}-val" placeholder="enter the real element % from passport" min="0" max="100" step="0.1">
        </div>
        <div class="row">
          <button type="button" class="proof" id="${cardId}-btn-proof" onclick="generateProof('${cardId}', '${recycler_uid}')">generate zk proof</button>
          <button type="button" class="action" id="${cardId}-btn-send" style="display:none" onclick="sendResult('${cardId}', '${recycler_uid}')">send proof to recycler</button>
        </div>
        <div id="${cardId}-proof-anim" class="proof-anim">
          <span class="blink">generating groth16 proof in browser</span> — please wait...
        </div>
      </div>`;
    document.getElementById("session-list").appendChild(card);
  }

  function updateCardStatus(cardId, text, cls) {
    const el = document.getElementById(cardId + "-status");
    if (el) { el.textContent = text; el.className = "status-bar " + (cls || ""); }
  }

  function populateSessionCard(cardId, msg) {
    const opLabel = { gt: "Greater than (>)", lt: "Less than (<)" };
    document.getElementById(cardId + "-el").value     = msg.element;
    document.getElementById(cardId + "-cond").value   = opLabel[msg.operator] || msg.operator;
    document.getElementById(cardId + "-thresh").value = msg.threshold;
    document.getElementById(cardId + "-fields").style.display = "block";
    updateCardStatus(cardId, "ZKP request received — enter the actual element value and generate proof.", "warn");
  }

  async function generateProof(cardId, recyclerUid) {
    const valInput = document.getElementById(cardId + "-val").value;
    const val      = parseFloat(valInput);

    if (valInput === "" || isNaN(val)) {
      updateCardStatus(cardId, "Enter the actual measured element percentage first.", "err");
      return;
    }

    const session      = activeSessions[recyclerUid];
    const threshold    = parseFloat(document.getElementById(cardId + "-thresh").value);
    const valueScaled  = Math.round(val * 10);
    const threshScaled = Math.round(threshold * 10);
    const isGt         = session.operator === "gt" ? "1" : "0";

    document.getElementById(cardId + "-btn-proof").disabled = true;
    document.getElementById(cardId + "-proof-anim").style.display = "block";
    updateCardStatus(cardId, "Generating Groth16 ZK proof in browser — please wait...", "info");

    try {
      const { proof, publicSignals } = await snarkjs.groth16.fullProve(
        { value_scaled: String(valueScaled), threshold_scaled: String(threshScaled), is_gt: isGt },
        "/static/zkp/element_threshold.wasm",
        "/static/zkp/element_threshold_0000.zkey"
      );

      session.proof         = proof;
      session.publicSignals = publicSignals;

      document.getElementById(cardId + "-proof-anim").style.display = "none";
      document.getElementById(cardId + "-btn-send").style.display = "inline-block";
      updateCardStatus(cardId, "ZK proof ready. Send to recycler — they will verify cryptographically.", "ok");

    } catch (err) {
      document.getElementById(cardId + "-proof-anim").style.display = "none";
      document.getElementById(cardId + "-btn-proof").disabled = false;
      updateCardStatus(cardId, "Proof generation failed: " + err.message, "err");
    }
  }

  function sendResult(cardId, recyclerUid) {
    const session = activeSessions[recyclerUid];
    if (!session || !session.proof || !session.dc) return;

    // Send proof + public signals over WebRTC data channel — raw value never transmitted
    session.dc.send(JSON.stringify({
      type:          "zkp_result",
      proof:         session.proof,
      publicSignals: session.publicSignals,
      element:       session.element,
      operator:      session.operator,
      threshold:     session.threshold
    }));

    document.getElementById(cardId + "-btn-send").disabled = true;
    updateCardStatus(cardId, "Proof sent over WebRTC channel — session closing.", "info");

    setTimeout(() => {
      try { session.dc.close(); session.pc.close(); } catch {}
      delete activeSessions[recyclerUid];
      const card = document.getElementById(cardId);
      if (card) card.style.opacity = "0.4";
      if (Object.keys(activeSessions).length === 0) {
        document.getElementById("standing-by").style.display = "block";
        setMfrStatus("All sessions closed. Standing by.", "info");
      }
    }, 1500);
  }

  // ============================================================
  // INIT
  // ============================================================
  if (myRole === "RECYCLER") {
    initRecycler();
  } else if (myRole === "MANUFACTURER") {
    initManufacturer();
  } else {
    document.getElementById("view-manufacturer").style.display = "block";
    document.getElementById("mfr-status").textContent = "This page is for MANUFACTURER and RECYCLER roles.";
    document.getElementById("mfr-status").className = "status-bar warn";
  }
</script>
</body>
</html>
