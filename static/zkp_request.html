<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZKP Request — TRACE4MAGNET</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #0f0f0f; color: #ddd; min-height: 100vh; padding: 32px; }

    .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; }
    h1 { font-size: 13px; color: #555; letter-spacing: 3px; text-transform: uppercase; }
    .topbar-right { font-size: 11px; color: #444; }
    .topbar-right span { color: #777; margin-right: 16px; }
    .topbar-right a { color: #444; cursor: pointer; text-decoration: none; }
    .topbar-right a:hover { color: #aaa; }

    .panel { background: #161616; border: 1px solid #1e1e1e; border-radius: 6px; padding: 24px; margin-bottom: 20px; }
    .panel h2 { font-size: 11px; color: #444; letter-spacing: 2px; margin-bottom: 18px; }

    .target-card { background: #111; border: 1px solid #222; border-radius: 4px; padding: 14px 18px;
      margin-bottom: 22px; display: flex; gap: 24px; align-items: center; font-size: 12px; color: #777; }
    .target-card strong { color: #ddd; }

    .field-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
    label { font-size: 11px; color: #555; width: 120px; flex-shrink: 0; }
    select, input {
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #ddd;
      padding: 8px 12px; border-radius: 4px; font-size: 12px; font-family: monospace; flex: 1;
    }
    select:focus, input:focus { outline: none; border-color: #444; }

    button {
      background: #1e1e1e; border: 1px solid #2e2e2e; color: #aaa;
      padding: 9px 24px; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-family: monospace; letter-spacing: 1px;
    }
    button:hover { background: #252525; border-color: #444; color: #ddd; }
    button:disabled { opacity: 0.3; cursor: default; }
    button.send { border-color: #2a3a2a; color: #81c784; }
    button.send:hover { background: #1a2a1a; }
    button.back { border-color: #222; color: #555; }
    button.back:hover { background: #1a1a1a; border-color: #333; color: #888; }

    .row { display: flex; gap: 10px; margin-top: 20px; align-items: center; }

    .msg {
      font-size: 11px; padding: 8px 14px; border-radius: 4px;
      background: #1a1a1a; border: 1px solid #222; margin-top: 14px; color: #555;
    }
    .msg.ok  { color: #4caf50; border-color: #1a3a1a; }
    .msg.err { color: #ef5350; border-color: #3a1a1a; }

    .hint { font-size: 10px; color: #333; margin-top: 4px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; letter-spacing: 1px; }
    .badge.MANUFACTURER { background: #1a2a3a; color: #64b5f6; }
    .badge.RECYCLER     { background: #1a3a1a; color: #81c784; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>TRACE4MAGNET — ZKP REQUEST</h1>
  <div class="topbar-right">
    <span id="info-email"></span>
    <span class="badge" id="info-role-badge"></span>
    &nbsp;&nbsp;
    <a onclick="window.location.href='peer_discovery.html'">← back to peer list</a>
  </div>
</div>

<div class="panel">
  <h2>TARGET PEER</h2>
  <div class="target-card">
    <div>Peer: <strong id="target-name">—</strong></div>
    <div>Role: <span class="badge MANUFACTURER" id="target-role">MANUFACTURER</span></div>
    <div>Passport: <strong>DMP-TEST-001</strong></div>
  </div>

  <h2>VERIFICATION PARAMETERS</h2>
  <p class="hint" style="margin-bottom:18px; color:#333">
    The manufacturer will receive this request and prove the claim without revealing the actual value.
  </p>

  <div class="field-row">
    <label>element</label>
    <select id="sel-element">
      <option value="Nd">Neodymium (Nd)</option>
      <option value="Dy">Dysprosium (Dy)</option>
      <option value="Pr">Praseodymium (Pr)</option>
      <option value="Tb">Terbium (Tb)</option>
      <option value="Gd">Gadolinium (Gd)</option>
      <option value="La">Lanthanum (La)</option>
      <option value="Ce">Cerium (Ce)</option>
      <option value="Sm">Samarium (Sm)</option>
      <option value="Ho">Holmium (Ho)</option>
    </select>
  </div>

  <div class="field-row">
    <label>condition</label>
    <select id="sel-operator">
      <option value="gt">Greater than (&gt;)</option>
      <option value="lt">Less than (&lt;)</option>
    </select>
  </div>

  <div class="field-row">
    <label>threshold (%)</label>
    <input type="number" id="inp-threshold" placeholder="e.g. 30" min="0" max="100" step="0.1">
  </div>

  <div id="send-msg" class="msg" style="display:none"></div>

  <div class="row">
    <button type="button" id="btn-send" class="send">send verification request →</button>
    <button type="button" class="back" onclick="cancelRequest()">cancel</button>
  </div>
</div>

<script>
  const API = "http://localhost:8000/api/v1";

  const token   = sessionStorage.getItem("t4m_token");
  const myEmail = sessionStorage.getItem("t4m_email") || "";
  const myRole  = sessionStorage.getItem("t4m_role")  || "";
  const myUid   = sessionStorage.getItem("t4m_uid")   || "";
  const target  = JSON.parse(sessionStorage.getItem("t4m_target") || "null");

  // guard — must be RECYCLER with a chosen target
  if (!token || myRole !== "RECYCLER" || !target) {
    window.location.href = "peer_discovery.html";
  }

  document.getElementById("info-email").textContent = myEmail;
  const badge = document.getElementById("info-role-badge");
  badge.textContent = myRole;
  badge.className = "badge " + myRole;

  document.getElementById("target-name").textContent = target.name;
  document.getElementById("target-role").textContent = target.role;

  function showMsg(text, type) {
    const el = document.getElementById("send-msg");
    el.style.display = "block";
    el.className = "msg " + (type || "");
    el.textContent = text;
  }

  document.getElementById("btn-send").onclick = () => {
    const element   = document.getElementById("sel-element").value;
    const operator  = document.getElementById("sel-operator").value;
    const threshold = parseFloat(document.getElementById("inp-threshold").value);

    if (!threshold && threshold !== 0) {
      showMsg("Please enter a threshold value.", "err");
      return;
    }

    sessionStorage.setItem("t4m_zkp_form", JSON.stringify({
      element, operator, threshold, passport_id: "DMP-TEST-001"
    }));

    window.location.href = "zkp_queue.html";
  };

  async function cancelRequest() {
    // release the reserved slot
    if (target) {
      await fetch(`${API}/p2p/disconnect/${target.id}`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
      }).catch(() => {});
    }
    sessionStorage.removeItem("t4m_target");
    sessionStorage.removeItem("t4m_zkp_form");
    window.location.href = "peer_discovery.html";
  }
</script>
</body>
</html>
